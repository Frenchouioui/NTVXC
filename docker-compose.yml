services:
  ntvio:
    build: .
    image: ntvio-live:latest
    container_name: ntvio-live
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
