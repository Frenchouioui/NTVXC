services:
  ntvio:
    build: .
    container_name: ntvio-live
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7070}:7000"
    environment:
      - PORT=7000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/manifest.json').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
