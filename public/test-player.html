<!DOCTYPE html>
<html>
<head>
  <title>HLS Test Player</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; text-align:center; padding:20px;">
  <h2>Testing Fetch in Browser</h2>
  <div id="logs" style="margin-top:20px; font-family:monospace; text-align:left; max-width:720px; margin:20px auto; background:#222; padding:15px; border-radius:8px; white-space:pre-wrap;"></div>

  <script>
    const logs = document.getElementById('logs');
    function log(msg) {
      logs.textContent += msg + '\n';
    }

    async function run() {
      const url = 'https://premium.hls.st/playlist/premium1.m3u8';
      log('Fetching: ' + url);
      try {
        const res = await fetch(url);
        log('Fetch response status: ' + res.status);
        log('Content-Type: ' + res.headers.get('content-type'));
        log('CORS header: ' + res.headers.get('access-control-allow-origin'));
        const text = await res.text();
        log('Body first 200 chars:\n' + text.slice(0, 200));
      } catch (e) {
        log('Fetch error name: ' + e.name + ' | message: ' + e.message);
      }
    }

    run();
  </script>
</body>
</html>
